apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-os-service-migration
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-os-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-os-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U oficina -d oficina; do sleep 2; done
      containers:
        - name: migration
          image: oficina-os-service:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: oficina-os-service-config
            - secretRef:
                name: oficina-os-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
