# Stack local: 3 microsserviços + Postgres, RabbitMQ, Redis e MongoDB.
#   docker compose -f docker-compose.stack.yml up --build
# Requer pastas irmãs: ../oficina-billing-service e ../oficina-execution-service
# Contratos: instalados no build via CONTRACTS_GIT_URL no Dockerfile.

services:
  postgres-os:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_os
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina"]
      interval: 3s
      retries: 5

  postgres-billing:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_billing
    ports: ["5434:5432"]

  postgres-execution:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_execution
    ports: ["5435:5432"]

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]

  os-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTRACTS_GIT_URL: https://github.com/TGuapyassu/oficina-contracts.git@v0.1.0
    ports: ["8000:8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://oficina:oficina@postgres-os:5432/oficina_os
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MONGODB_URL: mongodb://mongodb:27017
      INTERNAL_SERVICE_KEY: dev-internal-key
      JWT_SECRET: ${JWT_SECRET:-defina-um-segredo-longo-para-producao}
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres-os: { condition: service_healthy }
      rabbitmq: { condition: service_started }

  billing-service:
    build:
      context: ../oficina-billing-service
      dockerfile: Dockerfile
    ports: ["8003:8003"]
    environment:
      DATABASE_URL: postgresql+psycopg2://oficina:oficina@postgres-billing:5432/oficina_billing
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MONGODB_URL: mongodb://mongodb:27017
      OS_SERVICE_URL: http://os-service:8000
      INTERNAL_SERVICE_KEY: dev-internal-key
    depends_on: [rabbitmq, mongodb, postgres-billing, os-service]

  execution-service:
    build:
      context: ../oficina-execution-service
      dockerfile: Dockerfile
    ports: ["8002:8002"]
    environment:
      DATABASE_URL: postgresql+psycopg2://oficina:oficina@postgres-execution:5432/oficina_execution
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      OS_SERVICE_URL: http://os-service:8000
      INTERNAL_SERVICE_KEY: dev-internal-key
    depends_on: [rabbitmq, redis, postgres-execution, os-service]
