name: CI/CD

on:
  push:
    branches: [homolog, main]
  pull_request:
    branches: [homolog, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/oficina-contracts
          path: oficina-contracts
          ref: v0.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e ./oficina-contracts
          pip install -e ".[dev]"
          pytest --cov-report=xml --cov-report=html --cov-report=term-missing
      - run: pip install ruff && ruff check app
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  docker-validate:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oficina-os-service:ci .

  build:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/oficina-os-service" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          export IMAGE="ghcr.io/${OWNER}/oficina-os-service:${{ github.sha }}"
          export SKIP_PLATFORM=true
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export WEBHOOK_API_KEY="${{ secrets.WEBHOOK_API_KEY }}"
          export RABBITMQ_URL="${{ secrets.RABBITMQ_URL }}"
          export MONGODB_URL="${{ secrets.MONGODB_URL }}"
          export INTERNAL_SERVICE_KEY="${{ secrets.INTERNAL_SERVICE_KEY }}"
          bash scripts/k8s-deploy.sh
