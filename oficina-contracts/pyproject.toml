[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oficina-contracts"
version = "0.1.0"
description = "Contratos de eventos e DTOs internos — Saga oficina"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oficina_contracts*"]
